<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>latihan 5</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
    />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4">
              <h2 class="text-center text-primary mb-4 fw-bold">
                Daftar Tugas
              </h2>

              <div class="input-group mb-4">
                <input
                  type="text"
                  id="inputT"
                  class="form-control form-control-lg"
                  placeholder="Ketik Tugas Baru"
                />
                <button class="btn btn-primary btn-lg" id="btnT">Tambah</button>
              </div>

              <div id="areaList">
                <p class="text-center text-muted">Belum ada tugas hari ini</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
